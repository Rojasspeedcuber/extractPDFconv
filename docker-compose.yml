version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_convocacoes
    environment:
      POSTGRES_USER: eleicoes_user
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: convocacoes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleicoes_user -d convocacoes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Aplicação PDF Extractor
  pdf-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_extractor_app
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - MAX_FILE_SIZE_MB=20
      - USE_MOCK_EXTRACTION=false
      - DATABASE_URL=postgresql://eleicoes_user:senha123@postgres:5432/convocacoes
      - PERSIST_TO_DB=true
    volumes:
      - ./storage/temp:/app/storage/temp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
